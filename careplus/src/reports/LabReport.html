<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Report</title>
<style>
  /* Set width for 80mm printer */
  body {
    width: 80mm;
    font-family: Arial, sans-serif;
    font-size: 12px;
    margin: 0;
    padding: 5px;
    color: #000;
  }

  h1, h2, h3 {
    margin: 0;
    padding: 0;
    text-align: center;
    font-size: 14px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 5px;
  }

  th, td {
    border-bottom: 1px dashed #000;
    padding: 2px 0;
    text-align: left;
  }

  th {
    font-weight: bold;
    text-align: left;
  }

  .total {
    font-weight: bold;
    margin-top: 5px;
    text-align: right;
  }

  .footer {
    text-align: center;
    margin-top: 10px;
    font-size: 10px;
  }

</style>
</head>
<body>
  <h1>Laboratory Report</h1>
  <div id="reportDate"></div>

  <table id="labsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Unit</th>
      </tr>
    </thead>
    <tbody>
      <!-- Lab rows will be injected here -->
    </tbody>
  </table>

  <div class="total" id="totalPrice"></div>
  <div class="footer">Thank you for choosing our laboratory!</div>

  <script>
  window.addEventListener("message", (event) => {
    const labData = event.data;
    if (!labData) return;

    const tbody = document.querySelector("#labsTable tbody");
    tbody.innerHTML = ""; // clear

    labData.selectedLabs.forEach(lab => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${lab.name}</td>
        <td>${lab.price.toFixed(2)} ${labData.currency}</td>
        <td>${lab.unit}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("totalPrice").innerText =
      "Total: " + labData.totalPrice.toFixed(2) + " " + labData.currency;

    document.getElementById("reportDate").innerText = new Date().toLocaleString();

    window.print(); // open print dialog
  });
</script>
</body>
</html>
