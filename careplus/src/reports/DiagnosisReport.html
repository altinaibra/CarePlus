<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Diagnosis Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        color: #111;
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .header img {
        width: 24px;
        height: 24px;
        margin-right: 10px;
      }

      h2 {
        margin: 0;
        font-size: 20px;
      }

      .info-grid {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }

      .info-grid div {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .info-grid label {
        font-weight: bold;
        margin-bottom: 5px;
      }

      .info-grid input[type="text"],
      .info-grid input[type="number"] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .info-grid .gender-group {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 5px;
      }

      .checkbox-section {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }

      .checkbox-section input[type="checkbox"] {
        margin-right: 10px;
        transform: scale(1.2);
      }

      .checkbox-section input[type="text"] {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 8px;
        margin-left: 10px;
      }

      .section {
        margin-bottom: 20px;
      }

      .section label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
      }

      .section textarea {
        width: 100%;
        min-height: 80px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        resize: none;
        font-size: 14px;
      }

      .signature {
        margin-top: 40px;
        text-align: right;
        font-weight: bold;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img
        src="https://cdn-icons-png.flaticon.com/512/2910/2910764.png"
        alt="Medical Icon"
      />
      <h2>Diagnosis Report</h2>
    </div>

    <div class="info-grid">
      <div>
        <label>Patient Name</label>
        <input type="text" value="aa" />
      </div>
      <div>
        <label>Patient Age</label>
        <input type="number" value="22" />
      </div>
      <div>
        <label>Patient Gender</label>
        <div class="gender-group">
          <label><input type="radio" name="gender" checked /> Female</label>
          <label><input type="radio" name="gender" /> Male</label>
        </div>
      </div>
    </div>

    <div class="checkbox-section">
      <input type="checkbox" checked />
      <label>Does the patient have allergies?</label>
      <input type="text" placeholder="List allergies" />
    </div>

    <div class="section">
      <label>Diagnosis</label>
      <textarea placeholder="Enter diagnosis"></textarea>
    </div>

    <div class="section">
      <label>Prescription</label>
      <textarea placeholder="Enter prescription details"></textarea>
    </div>

    <div class="signature">Doctor Signature</div>
  </body>
</html>
