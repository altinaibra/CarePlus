<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Diagnosis Report</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        color: #000;
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .header img {
        width: 50px;
        height: 50px;
        margin-right: 10px;
      }

      h2 {
        margin: 0;
      }

      .section {
        margin-bottom: 20px;
      }

      .section label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
      }

      .section p {
        border: 1px solid #ccc;
        padding: 10px;
        min-height: 20px;
        margin: 0;
        border-radius: 4px;
      }

      .checkbox {
        display: flex;
        align-items: center;
        margin-top: 5px;
      }

      .checkbox input {
        margin-right: 10px;
      }

      .signature {
        margin-top: 50px;
        text-align: right;
        font-weight: bold;
      }

      .info-grid {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
      }

      .info-grid div {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img
        src="https://cdn-icons-png.flaticon.com/512/2910/2910764.png"
        alt="Medical Icon"
      />
      <h2>Diagnosis Report</h2>
    </div>

    <div class="section info-grid">
      <div>
        <label>Patient Name</label>
        <p id="patientName"></p>
      </div>
      <div>
        <label>Patient Age</label>
        <p id="patientAge"></p>
      </div>
      <div>
        <label>Patient Gender</label>
        <p id="patientGender"></p>
      </div>
    </div>

    <div class="section checkbox">
      <input type="checkbox" id="allergies" />
      <label for="allergies">Does the patient have allergies?</label>
    </div>

    <div class="section">
      <label>Diagnosis</label>
      <p
        id="diagnosis"
        style="min-height: 100px; padding: 15px; font-size: 14px"
      ></p>
    </div>

    <div class="section">
      <label>Prescription</label>
      <p
        id="prescription"
        style="min-height: 100px; padding: 15px; font-size: 14px"
      ></p>
    </div>

    <div class="signature">Doctor Signature</div>
  </body>
</html>
